name: Publish blocky-game

on:
  push:
    tags:
      - "blocky-game@*"

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Match the tag to the package version
        run: test "$GITHUB_REF_NAME" = "blocky-game@$(jq -r .version packages/blocky-game/package.json)"

      - run: bun run test

      - run: bun run build:packages

      - name: Stage for approval on npmjs.com
        working-directory: packages/blocky-game
        run: npm stage publish
