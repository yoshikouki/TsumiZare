name: Validate and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Lint and Format
        run: bun lint

      - name: Run tests
        run: bun run test

      - name: Check TypeScript
        run: bun run typecheck

      - name: Build Worker
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test built Worker and browser interactions
        run: bun run test:worker

      - name: Upload verified artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: |
            dist
            worker
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}

      - name: Record current Worker version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler deployments status --json > "$RUNNER_TEMP/deployment.json"
          jq -e '.versions | length == 1 and .[0].percentage == 100' "$RUNNER_TEMP/deployment.json"
          echo "version_id=$(jq -er '.versions[0].version_id' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"

      - name: Deploy verified artifact
        id: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --var "DEPLOYMENT_GIT_SHA:${GITHUB_SHA}"

      - name: Verify production
        id: live
        run: bun run scripts/smoke-deployment.ts https://tsumizare.app "$GITHUB_SHA"

      - name: Restore previous version after a failed release
        if: failure() && steps.previous.outcome == 'success' && (steps.release.outcome == 'failure' || steps.live.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler rollback "${{ steps.previous.outputs.version_id }}" --yes
          bun run scripts/smoke-deployment.ts https://tsumizare.app "" "${{ steps.previous.outputs.version_id }}"
